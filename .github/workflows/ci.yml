name: CI

# Manual-trigger only — file kept in repo to demonstrate the testing harness
# but does not run on push (avoids notification spam during the assignment
# grading window). Trigger from the GitHub Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        working-directory: backend
        run: ruff check rxsentinel tests evals

      - name: Run unit tests
        working-directory: backend
        run: pytest -v -m "not integration"

  frontend-build:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Build
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
